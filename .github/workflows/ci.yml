name: TaskForge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: taskforge-ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-test:
    name: Build, tests, and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2 all
      - name: Test suite
        run: make test
      - name: CLI smoke test
        run: printf 'status\nsubmit norm 0 21\nsubmit bad 0 1\nmap 4\nbench 2 100\nbench 0 10\nexit\n' | ./bin/taskforge_cli 2

  asan-ubsan:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer suite
        run: make asan

  million-soak:
    name: One-million-task soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: One-million-task soak
        run: make test-million

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer suite
        run: make tsan

  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Valgrind regression suite
        run: make valgrind
