name: TaskForge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2 all
      - name: Test suite
        run: make test
      - name: CLI smoke test
        run: printf 'status\nbench 2 100\nexit\n' | ./bin/taskforge_cli 2
      - name: AddressSanitizer and UBSan
        run: make asan
      - name: One-million-task soak
        run: make test-million
      - name: ThreadSanitizer
        run: make tsan
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Valgrind
        run: make valgrind
