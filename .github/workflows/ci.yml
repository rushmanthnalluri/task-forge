name: TaskForge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2 all
      - name: Test suite
        run: make test
      - name: AddressSanitizer and UBSan
        run: make asan
